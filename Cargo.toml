[workspace]
resolver = "2"
members = [
    "crates/trading-core",
    "crates/trading-exchange",
    "crates/trading-strategy",
    "crates/trading-risk",
    "crates/trading-ai",
    "crates/trading-db",
    "crates/trading-api",
    "crates/trading-desktop",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true