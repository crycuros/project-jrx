[package]
name = "trading-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["wgpu", "default_fonts"] }
wgpu = "22.0"
egui = "0.29"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
notify-rust = "4"
trading-core = { path = "../trading-core" }
trading-api = { path = "../trading-api" }
trading-exchange = { path = "../trading-exchange" }
trading-strategy = { path = "../trading-strategy" }
trading-risk = { path = "../trading-risk" }
trading-ai = { path = "../trading-ai" }
trading-db = { path = "../trading-db" }
trading-engine = { path = "../trading-engine" }